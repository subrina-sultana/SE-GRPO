<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Enhancement Audio Demonstration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #e0e0e0;
        }

        audio {
            width: 200px;
            height: 40px;
        }
    </style>
</head>

<body>

<h1>Speech Enhancement Audio Demonstration</h1>

<table>
    <thead>
        <tr>
            <th>Method</th>
            <th>Sample 1</th>
            <th>Sample 2</th>
            <th>Sample 3</th>
            <th>Sample 4</th>
            <th>Sample 5</th>
        </tr>
    </thead>

    <tbody id="audio-table"></tbody>
</table>

<script>
    const methods = [
        ["Clean", "clean"],
        ["Noisy", "noisy"],
        ["SSL-SE", "SSL-SE"],
        ["GRPO-SE", "GRPO-SE"]
    ];

    const table = document.getElementById("audio-table");

    methods.forEach(([name, folder]) => {
        const row = document.createElement("tr");

        row.innerHTML = `<th>${name}</th>`;

        for (let i = 1; i <= 5; i++) {
            row.innerHTML += `
                <td>
                    <audio controls preload="none">
                        <source 
                            src="audio/${folder}/sample${i}.wav"
                            type="audio/wav">
                    </audio>
                </td>`;
        }

        table.appendChild(row);
    });

    // Pause other audio players when one starts playing
    document.querySelectorAll("audio").forEach(player => {
        player.addEventListener("play", () => {
            document.querySelectorAll("audio").forEach(other => {
                if (other !== player) {
                    other.pause();
                }
            });
        });
    });
</script>

</body>
</html>
