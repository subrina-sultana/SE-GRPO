<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Enhancement Audio Demonstration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 30px;
        }

        h1, p {
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #e0e0e0;
        }

        audio {
            width: 220px;
            height: 45px;
        }

        .error {
            color: red;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h1>Speech Enhancement Audio Demonstration</h1>

<p>Comparison of Clean, Noisy, SSL-SE, and GRPO-SE speech.</p>

<p id="status">Loading audio samples...</p>

<div class="table-container">
    <table>
        <thead id="table-header"></thead>
        <tbody id="audio-table"></tbody>
    </table>
</div>

<script>

const owner = "subrina-sultana";
const repo = "SE-GRPO";
const branch = "main";

const methods = [
    ["Clean", "clean"],
    ["Noisy", "noisy"],
    ["SSL-SE", "SSL-SE"],
    ["GRPO-SE", "GRPO-SE"]
];

async function loadAudio() {

    try {

        // Automatically retrieve filenames from clean directory
        const response = await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/Audio/clean?ref=${branch}`
        );

        if (!response.ok) {
            throw new Error(`GitHub API error: ${response.status}`);
        }

        const files = await response.json();

        // Select all WAV files automatically
        const samples = files
            .filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".wav")
            )
            .map(file => file.name)
            .sort();

        if (samples.length === 0) {
            throw new Error("No WAV files found.");
        }

        // Create column headers dynamically
        document.getElementById("table-header").innerHTML = `
            <tr>
                <th>Method</th>
                ${samples.map((filename, i) => `
                    <th>
                        Sample ${i + 1}<br>
                        ${filename.replace(/\.wav$/i, "")}
                    </th>
                `).join("")}
            </tr>
        `;

        const table = document.getElementById("audio-table");
        table.innerHTML = "";

        // Create audio players dynamically
        methods.forEach(([name, folder]) => {

            const row = document.createElement("tr");

            row.innerHTML = `<th>${name}</th>`;

            samples.forEach(filename => {

                const path =
                    `./Audio/${folder}/${encodeURIComponent(filename)}`;

                row.innerHTML += `
                    <td>
                        <audio controls loop preload="none"
                               src="${path}">
                        </audio>
                        <div class="error"></div>
                    </td>
                `;
            });

            table.appendChild(row);
        });

        const players = document.querySelectorAll("audio");

        players.forEach(player => {

            // Pause other audio when one starts playing
            player.addEventListener("play", () => {

                players.forEach(other => {
                    if (other !== player) {
                        other.pause();
                    }
                });

            });

            // Display loading errors
            player.addEventListener("error", () => {

                player.nextElementSibling.textContent =
                    "Audio unavailable";

                console.error("Cannot load:", player.src);

            });

        });

        document.getElementById("status").textContent =
            `${samples.length} samples | ${methods.length} methods | ` +
            `${samples.length * methods.length} audio players`;

    } catch (error) {

        document.getElementById("status").textContent =
            error.message;

        console.error(error);

    }
}

loadAudio();

</script>

</body>
</html>
