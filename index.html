<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Enhancement Audio Demonstration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 30px;
        }

        h1, p {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #e0e0e0;
        }

        audio {
            width: 220px;
        }

        .container {
            overflow-x: auto;
        }

        .error {
            color: red;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h1>Speech Enhancement Audio Demonstration</h1>

<p>Clean, Noisy, SSL-SE, and GRPO-SE</p>

<p id="status">Loading audio files...</p>

<div class="container">
    <table>
        <thead id="header"></thead>
        <tbody id="audio-table"></tbody>
    </table>
</div>

<script>

const owner = "subrina-sultana";
const repo = "SE-GRPO";
const branch = "main";

const api = `https://api.github.com/repos/${owner}/${repo}/contents`;

const methods = [
    ["Clean", "clean"],
    ["Noisy", "noisy"],
    ["SSL-SE", "ssl-se"],
    ["GRPO-SE", "grpo-se"]
];

// Read all WAV files from a directory
async function getFiles(folder) {

    const url = `${api}/Audio/${folder}?ref=${branch}`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(`${folder}: HTTP ${response.status}`);
    }

    const files = await response.json();

    return files.filter(file =>
        file.type === "file" &&
        file.name.toLowerCase().endsWith(".wav")
    ).sort((a, b) => a.name.localeCompare(b.name));
}

async function loadAudio() {

    // Retrieve the reference filenames
    let cleanFiles;

    try {
        cleanFiles = await getFiles("clean");
    } catch (error) {
        document.getElementById("status").textContent =
            error.message;
        return;
    }

    const samples = cleanFiles.map(file => file.name);

    // Generate column headers
    const header = document.getElementById("header");
    const headerRow = header.insertRow();

    headerRow.innerHTML = "<th>Method</th>";

    samples.forEach((filename, i) => {
        const th = document.createElement("th");
        th.textContent = `Sample ${i + 1}`;
        headerRow.appendChild(th);
    });

    const table = document.getElementById("audio-table");

    for (const [name, folder] of methods) {

        const row = table.insertRow();
        const th = document.createElement("th");

        th.textContent = name;
        row.appendChild(th);

        let files;

        try {
            files = folder === "clean"
                ? cleanFiles
                : await getFiles(folder);
        } catch (error) {
            const cell = row.insertCell();
            cell.colSpan = samples.length;
            cell.textContent = error.message;
            continue;
        }

        const fileMap = new Map(
            files.map(file => [file.name, file])
        );

        samples.forEach(filename => {

            const cell = row.insertCell();
            const file = fileMap.get(filename);

            if (!file) {
                cell.textContent = "File not found";
                return;
            }

            const audio = document.createElement("audio");

            audio.controls = true;
            audio.loop = true;
            audio.preload = "metadata";

            // Use the actual raw audio URL from GitHub
            audio.src = file.download_url;

            cell.appendChild(audio);

            // Pause other audio players
            audio.addEventListener("play", () => {
                document.querySelectorAll("audio").forEach(other => {
                    if (other !== audio) {
                        other.pause();
                    }
                });
            });

            // Show an error if loading fails
            audio.addEventListener("error", () => {
                const message = document.createElement("div");
                message.className = "error";
                message.textContent = "Cannot load audio";
                cell.appendChild(message);

                console.error("Audio error:", audio.src);
            });

        });
    }

    document.getElementById("status").textContent =
        `${samples.length} reference samples. Click play to listen.`;

}

loadAudio();

</script>

</body>
</html>
